
name: Проверка Telegram-бота

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Проверить синтаксис
        run: python -m py_compile bot.py

      - name: Проверить Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          if not token:
              raise SystemExit("Не найден секрет TELEGRAM_BOT_TOKEN")

          req = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/getMe"
          )

          with urllib.request.urlopen(req, timeout=20) as response:
              result = json.load(response)

          if not result.get("ok"):
              raise SystemExit("Telegram отклонил токен")

          print("Telegram подключён:", result["result"].get("username"))
          PY

      - name: Проверить Groq
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python - <<'PY'
          import os
          from groq import Groq

          key = os.environ.get("GROQ_API_KEY", "").strip()
          if not key:
              raise SystemExit("Не найден секрет GROQ_API_KEY")

          try:
              result = Groq(api_key=key).chat.completions.create(
                  model="qwen/qwen3.8-27b",
                  messages=[
                      {"role": "user", "content": "Ответь одним словом: работает"}
                  ],
                  max_completion_tokens=30,
              )
              answer = result.choices[0].message.content
              if not (answer or "").strip():
                  raise RuntimeError("Пустой ответ от модели")
          except Exception as exc:
              raise SystemExit(
                  f"Проверка Groq не прошла: {type(exc).__name__}. "
                  "Проверь ключ, доступность модели и лимиты API."
              )

          print("Groq отвечает.")
          PY
