name: Проверка Telegram-бота

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Проверить синтаксис
        run: python -m py_compile bot.py
      - name: Проверить Telegram-токен
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          if not token:
              raise SystemExit("Секрет TELEGRAM_BOT_TOKEN не найден.")
          req = urllib.request.Request(f"https://api.telegram.org/bot{token}/getMe")
          try:
              with urllib.request.urlopen(req, timeout=15) as response:
                  result = json.load(response)
          except Exception as exc:
              raise SystemExit(f"Проверка Telegram не прошла: {type(exc).__name__}")
          if not result.get("ok"):
              raise SystemExit("Telegram отклонил токен.")
          print("Telegram подключён. Бот:", result["result"].get("username"))
          PY
      - name: Проверить Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          from google import genai
          key = os.environ.get("GEMINI_API_KEY", "").strip()
          if not key:
              raise SystemExit("Секрет GEMINI_API_KEY не найден.")
          try:
              result = genai.Client(api_key=key).models.generate_content(
                  model="gemini-2.5-flash", contents="Ответь одним словом: работает"
              )
              if not (result.text or "").strip():
                  raise RuntimeError("Пустой ответ")
          except Exception as exc:
              raise SystemExit(f"Проверка Gemini не прошла: {type(exc).__name__}; проверь ключ, модель и квоту.")
          print("Gemini отвечает.")
          PY